<style>
:root{--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --rule:#c3c2b7;--hairline:rgba(11,11,11,.10);--accent:#2a78d6;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--rule:#383835;
  --hairline:rgba(255,255,255,.10);--accent:#3987e5;--crit:#e66767}}
:root[data-theme="dark"]{--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;
  --rule:#383835;--hairline:rgba(255,255,255,.10);--accent:#3987e5;--crit:#e66767}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--plane);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;
  padding:32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
p{margin:0;font-size:.84rem;color:var(--ink2);line-height:1.6}
form{display:flex;flex-direction:column;gap:10px}
input{font:inherit;font-size:.95rem;padding:11px 13px;border-radius:8px;
  border:1px solid var(--rule);background:var(--plane);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font:inherit;font-weight:500;font-size:.92rem;padding:11px 13px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.err{font-size:.82rem;color:var(--crit);min-height:1.2em}
.meta{font-size:.74rem;color:var(--muted)}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById("f"), pw = document.getElementById("pw"),
      er = document.getElementById("e"), btn = document.getElementById("b");
async function unlock(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
f.addEventListener("submit", async ev => {
  ev.preventDefault();
  er.textContent = ""; btn.disabled = true; btn.textContent = "여는 중…";
  try {
    const html = await unlock(pw.value);
    try { sessionStorage.setItem("dk", pw.value); } catch (_) {}
    document.open(); document.write(html); document.close();
  } catch (_) {
    er.textContent = "비밀번호가 맞지 않습니다.";
    btn.disabled = false; btn.textContent = "열기"; pw.select();
  }
});
(async () => {                       // 같은 탭에서 다시 열면 비밀번호를 다시 묻지 않는다
  let saved = null;
  try { saved = sessionStorage.getItem("dk"); } catch (_) {}
  if (!saved) return;
  try {
    const html = await unlock(saved);
    document.open(); document.write(html); document.close();
  } catch (_) { try { sessionStorage.removeItem("dk"); } catch (_) {} }
})();
</script>
